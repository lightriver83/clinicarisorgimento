name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Dopo il deploy avvisa IndexNow (Bing, Yandex, Seznam, Naver…) delle URL in sitemap.
    # La chiave è il nome del file public/<chiave>.txt: pubblica per protocollo, non è un segreto.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invia le URL della sitemap a IndexNow
        run: |
          set -euo pipefail
          HOST=clinicarisorgimento.it
          KEY=$(basename "$(ls public/*.txt | grep -E '/[a-f0-9]{32}\.txt$' | head -1)" .txt)
          # querystring diversa a ogni run: la CDN di GitHub Pages non serve la copia in cache
          for i in $(seq 1 12); do
            [ "$(curl -s "https://$HOST/$KEY.txt?r=$GITHUB_RUN_ID")" = "$KEY" ] && break
            sleep 10
          done
          URLS=$(curl -sf "https://$HOST/sitemap-0.xml?r=$GITHUB_RUN_ID" | grep -o '<loc>[^<]*</loc>' | sed -e 's#<loc>##' -e 's#</loc>##' | jq -R . | jq -s .)
          BODY=$(jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "https://$HOST/$KEY.txt" --argjson urls "$URLS" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:$urls}')
          echo "$BODY"
          CODE=$(curl -s -o /tmp/indexnow.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$BODY")
          echo "IndexNow HTTP $CODE"; cat /tmp/indexnow.txt || true
          case "$CODE" in 200|202) ;; *) exit 1 ;; esac
